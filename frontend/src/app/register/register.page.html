<!-- CONTENIDO PRINCIPAL DEL REGISTRO — SIN ION-HEADER PARA NO BLOQUEAR EL HERO -->
<ion-content class="rg-content" [fullscreen]="true">

  <!-- BOTON BACK FLOTANTE EN ESQUINA SUPERIOR IZQUIERDA -->
  <button type="button"
    class="rg-back"
    aria-label="Volver"
    (click)="goBack()">
    <ph-arrow-left weight="bold" size="20"></ph-arrow-left>
  </button>

  <!-- RAIZ DEL REGISTRO — ANCHO COMPLETO Y CONTENIDO CENTRADO HORIZONTALMENTE -->
  <div #rootEl class="rg-root">

    <!-- CAPA DE PARTICULAS DECORATIVA AL FONDO — MUY ATENUADA -->
    <app-particle-network
      class="rg-particles"
      [particleCount]="32"
      [maxDistance]="120"
      [speed]="0.28"
      particleColor="#7C3AED"
      lineColor="#A78BFA">
    </app-particle-network>

    <!-- HALO RADIAL DETRAS DE LA MASCOTA QUE DA SENSACION DE GUARDIAN -->
    <div class="rg-halo" aria-hidden="true"></div>

    <!-- CABECERA EMOCIONAL DEL REGISTRO — MASCOTA + TITULO + STEPPER DE OJOS -->
    <header class="rg-hero">
      <!-- MASCOTA REACTIVA AL ESTADO DEL FORMULARIO -->
      <div class="rg-mascot">
        <app-argus [size]="84" [mood]="argusMood"></app-argus>
      </div>
      <!-- TITULO DEL FLUJO DE FORJA -->
      <h1 class="rg-title">Forja tu llave maestra</h1>
      <!-- SUBTITULO QUE BAJA LA BARRERA DE ENTRADA -->
      <p class="rg-sub">La única contraseña que necesitarás recordar.</p>

      <!-- STEPPER DE 3 OJOS QUE SE VAN ABRIENDO AL COMPLETAR BLOQUES -->
      <div class="rg-stepper" aria-label="Progreso del registro">
        <span *ngFor="let s of [1,2,3]"
          class="rg-stepper__node"
          [class.rg-stepper__node--active]="currentStep >= s">
          <svg viewBox="0 0 24 16" aria-hidden="true">
            <path class="rg-stepper__shape" d="M2 8 Q12 -1 22 8 Q12 17 2 8 Z"/>
            <circle class="rg-stepper__iris" cx="12" cy="8" r="3.4"/>
            <rect class="rg-stepper__lid" x="0" y="0" width="24" height="16" rx="8"/>
          </svg>
        </span>
      </div>
    </header>

    <!-- TARJETA PRINCIPAL DE LA FORJA — CONTIENE TODOS LOS INPUTS Y BLOQUES -->
    <section class="rg-card">

      <!-- BLOQUE NOMBRE -->
      <div class="rg-field">
        <label class="rg-field__label" for="rg-name">Nombre</label>
        <div class="rg-input"
          [class.rg-input--focus]="focusedField === 'name'"
          [class.rg-input--filled]="!!name">
          <ph-user weight="bold" size="20" class="rg-input__icon"></ph-user>
          <input id="rg-name"
            class="rg-input__field"
            type="text"
            placeholder="Tu nombre"
            autocomplete="given-name"
            [(ngModel)]="name"
            (focus)="onFocus('name')"
            (blur)="onBlur('name')">
        </div>
      </div>

      <!-- BLOQUE EMAIL -->
      <div class="rg-field">
        <label class="rg-field__label" for="rg-email">Email</label>
        <div class="rg-input"
          [class.rg-input--focus]="focusedField === 'email'"
          [class.rg-input--filled]="!!email">
          <ph-envelope weight="bold" size="20" class="rg-input__icon"></ph-envelope>
          <input id="rg-email"
            class="rg-input__field"
            type="email"
            placeholder="tu@email.com"
            autocomplete="email"
            [(ngModel)]="email"
            (focus)="onFocus('email')"
            (blur)="onBlur('email')">
        </div>
      </div>

      <!-- BLOQUE CONTRASEÑA MAESTRA -->
      <div class="rg-field">
        <label class="rg-field__label" for="rg-password">
          Contraseña maestra
          <span class="rg-field__hint">— Mínimo 12 caracteres</span>
        </label>
        <div class="rg-input rg-input--password"
          [class.rg-input--focus]="focusedField === 'password'"
          [class.rg-input--filled]="!!password"
          [class.rg-input--weak]="password && passwordStrength <= 1">
          <ph-lock weight="bold" size="20" class="rg-input__icon"></ph-lock>
          <input id="rg-password"
            class="rg-input__field"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Crea tu llave maestra"
            autocomplete="new-password"
            [(ngModel)]="password"
            (input)="onPasswordInput()"
            (focus)="onFocus('password')"
            (blur)="onBlur('password')">
          <button type="button"
            class="rg-input__toggle"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="showPassword = !showPassword">
            <ph-eye      *ngIf="!showPassword" weight="bold" size="20"></ph-eye>
            <ph-eye-slash *ngIf="showPassword"  weight="bold" size="20"></ph-eye-slash>
          </button>
        </div>

        <!-- FORJA: 5 RUNAS QUE SE ILUMINAN CON LA FORTALEZA -->
        <div class="rg-forge" *ngIf="password" aria-live="polite">
          <!-- ANILLO QUE ENVUELVE LAS RUNAS PARA EL BURST DE LOGRO -->
          <div class="rg-forge-ring"
            [style.--rg-strength-color]="passwordStrengthColor">
            <span *ngFor="let r of runeIndices"
              class="rg-rune"
              [class.rg-rune--lit]="r < passwordStrength">
              <span class="rg-rune__dot"></span>
            </span>
          </div>
          <!-- ETIQUETA TEXTUAL DE LA FORTALEZA -->
          <span class="rg-forge__label"
            [style.color]="passwordStrengthColor">
            {{ passwordStrengthLabel }}
          </span>
        </div>
      </div>

      <!-- BLOQUE CONFIRMAR CONTRASEÑA -->
      <div class="rg-field">
        <label class="rg-field__label" for="rg-confirm">Confirmar contraseña</label>
        <div class="rg-input"
          [class.rg-input--focus]="focusedField === 'confirm'"
          [class.rg-input--filled]="!!confirmPassword"
          [class.rg-input--match]="passwordsMatch"
          [class.rg-input--mismatch]="confirmPassword && !passwordsMatch">
          <ph-lock-key weight="bold" size="20" class="rg-input__icon"></ph-lock-key>
          <input id="rg-confirm"
            class="rg-input__field"
            type="password"
            placeholder="Repite tu llave maestra"
            autocomplete="new-password"
            [(ngModel)]="confirmPassword"
            (focus)="onFocus('confirm')"
            (blur)="onBlur('confirm')">
          <span class="rg-input__match" *ngIf="passwordsMatch" aria-hidden="true">
            <ph-check-circle weight="fill" size="20"></ph-check-circle>
          </span>
        </div>
      </div>

      <!-- TARJETA PROMESA ZERO-KNOWLEDGE CON CANDADO ANIMADO -->
      <div class="rg-zk" role="note" aria-label="Promesa Zero-Knowledge">
        <!-- ICONO CANDADO QUE PULSA SUAVEMENTE -->
        <div class="rg-zk__icon" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <!-- CUERPO DEL CANDADO -->
            <rect x="6" y="14" width="20" height="14" rx="3"
              fill="none" stroke="currentColor" stroke-width="2"/>
            <!-- ARO DEL CANDADO QUE SE CIERRA EN LOOP -->
            <path class="rg-zk__shackle"
              d="M10 14 V10 a6 6 0 0 1 12 0 V14"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
            <!-- BLOQUE INTERIOR QUE INDICA QUE LA LLAVE ES TUYA -->
            <circle cx="16" cy="21" r="1.8" fill="currentColor"/>
            <line x1="16" y1="21" x2="16" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="rg-zk__copy">
          <div class="rg-zk__title">Zero-Knowledge real</div>
          <div class="rg-zk__desc">
            Tu llave maestra <strong>nunca sale de este dispositivo</strong>.
            Ni siquiera nosotros podemos verla.
          </div>
        </div>
      </div>

      <!-- BLOQUE TERMINOS DE USO -->
      <div class="rg-terms">
        <button type="button"
          class="rg-check"
          [class.rg-check--on]="acceptTerms"
          [attr.aria-pressed]="acceptTerms"
          (click)="acceptTerms = !acceptTerms">
          <ph-check *ngIf="acceptTerms" weight="bold" size="14"></ph-check>
        </button>
        <span class="rg-terms__text">
          Acepto los <strong>Términos de uso</strong> y la
          <strong>Política de privacidad</strong>.
        </span>
      </div>

      <!-- MENSAJE DE ERROR DEVUELTO POR EL BACKEND -->
      <div class="rg-error" *ngIf="errorMessage" role="alert">
        <ph-warning-circle weight="fill" size="18"></ph-warning-circle>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- BOTON DE SUBMIT — DOS ESTADOS VISUALES SEGUN canSubmit -->
      <button type="button"
        class="rg-submit"
        [class.rg-submit--charged]="canSubmit"
        [disabled]="!canSubmit"
        (click)="register()">
        <ph-spinner *ngIf="isLoading" weight="bold" size="20" class="rg-submit__spin"></ph-spinner>
        <ph-shield-plus *ngIf="!isLoading" weight="fill" size="18"></ph-shield-plus>
        <span *ngIf="!isLoading">Crear mi cuenta gratis</span>
        <span *ngIf="isLoading">Forjando…</span>
      </button>

      <!-- BOTON PARA IR A LOGIN PARA USUARIOS QUE YA TIENEN CUENTA -->
      <button type="button"
        class="rg-secondary"
        (click)="goToLogin()">
        ¿Ya tienes cuenta? <strong>Inicia sesión</strong>
      </button>

    </section>

  </div>
</ion-content>
