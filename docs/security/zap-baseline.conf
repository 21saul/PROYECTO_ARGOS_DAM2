# CONFIGURACION DECLARATIVA DEL ESCANEO BASELINE DE OWASP ZAP
#
# RESUMEN: ESTE ARCHIVO LO CONSUME zap-baseline.py PARA AJUSTAR EL
# COMPORTAMIENTO DEL ESCANER. CADA LINEA INDICA UNA REGLA DE ZAP Y EL
# NIVEL DESEADO (OFF, IGNORE, WARN, FAIL).
#
# FORMATO: <ID_REGLA>     <ACCION>     <DESCRIPCION CORTA>
#   - IGNORE: NO SE REPORTA (FALSO POSITIVO CONFIRMADO O ACEPTADO).
#   - WARN:   APARECE COMO WARNING PERO NO HACE FALLAR LA EJECUCION.
#   - FAIL:   HACE FALLAR EL PIPELINE SI APARECE EL HALLAZGO.
#
# REFERENCIAS:
#   - LISTADO DE REGLAS: https://www.zaproxy.org/docs/alerts/
#   - DOCUMENTACION DE LA CONFIG: https://www.zaproxy.org/docs/docker/baseline-scan/
#
# RELACION CON OTROS ARCHIVOS:
#   - docs/security/AUDITORIA_OWASP_ZAP.md (REPORTE COMPLETO)
#   - backend/public/openapi.yaml (CATALOGO DE ENDPOINTS USADO POR ZAP-API-SCAN)

